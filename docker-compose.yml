services:
  redis:
    image: redis:7-alpine
    restart: always

  web:
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_STORAGE_URL=redis://redis:6379/1
    volumes:
      - ./baza_hr_chik.db:/app/baza_hr_chik.db
    depends_on:
      - redis

  worker:
    build: .
    restart: always

    command: celery -A parser_pdf.app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_STORAGE_URL=redis://redis:6379/1
    volumes:
      - ./baza_hr_chik.db:/app/baza_hr_chik.db
    depends_on:
      - redis
